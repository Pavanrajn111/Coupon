<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identity Verifications | CouponEx Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("couponex-theme");
        const theme =
          savedTheme ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.classList.toggle(
          "theme-dark",
          theme === "dark",
        );
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        --bg: #fcf9f2;
        --surface: #ffffff;
        --surface-soft: #f6f3ec;
        --surface-muted: #f0eee7;
        --surface-border: #e5e2db;
        --surface-container: #f0eee7;
        --surface-container-low: #f6f3ec;
        --surface-container-high: #ebe8e1;
        --surface-container-highest: #e5e2db;
        --surface-container-lowest: #ffffff;
        --surface-variant: #e5e2db;
        --outline: #8d7168;
        --outline-variant: #e1bfb5;
        --text: #1c1c18;
        --text-soft: #4f5e80;
        --text-muted: #7b675a;
        --text-variant: #594139;
        --primary: #ff6b35;
        --primary-dark: #ab3500;
        --primary-container: #ff6b35;
        --primary-fixed-dim: #ffb59d;
        --primary-fixed: #ffdbd0;
        --navy: #0a1b39;
        --navy-soft: #374667;
        --error: #ba1a1a;
        --error-container: #ffdad6;
        --on-error-container: #93000a;
        --success: #4ade80;
        --shadow-soft: 0 10px 24px rgba(28, 28, 24, 0.06);
        --shadow-hover: 0 18px 40px rgba(28, 28, 24, 0.1);
        --on-primary: #ffffff;
        --on-secondary: #ffffff;
        --secondary: #4f5e80;
        --secondary-container: #c8d7fe;
        --on-secondary-container: #4e5d7f;
        --tertiary: #755b00;
        --tertiary-container: #cea62b;
        --on-tertiary: #ffffff;
        --on-tertiary-container: #4f3d00;
        --on-secondary-fixed: #0a1b39;
        --on-secondary-fixed-variant: #374667;
        --on-background: #1c1c18;
        --on-surface-variant: #594139;
        --card-bg: #ffffff;
        --card-border: #e5e2db;
        --badge-bg: rgba(255, 255, 255, 0.8);
        --secondary-fixed-dim: #b7c6ed;
        --hairline: #e7e2d8;
      }

      html.theme-dark {
        --bg: #0b1326;
        --surface: rgba(23, 31, 51, 0.88);
        --surface-soft: rgba(13, 24, 45, 0.8);
        --surface-muted: rgba(34, 42, 61, 0.88);
        --surface-border: rgba(192, 193, 255, 0.18);
        --surface-container: rgba(23, 31, 51, 0.88);
        --surface-container-low: rgba(19, 27, 46, 0.8);
        --surface-container-high: rgba(34, 42, 61, 0.88);
        --surface-container-highest: rgba(45, 52, 73, 0.9);
        --surface-container-lowest: #161f35;
        --surface-variant: rgba(70, 69, 84, 0.8);
        --outline: #8d7168;
        --outline-variant: rgba(70, 69, 84, 0.8);
        --text: #dae2fd;
        --text-soft: #c7c4d7;
        --text-muted: #98a2bd;
        --text-variant: #c7c4d7;
        --primary: #ff6b35;
        --primary-dark: #8083ff;
        --primary-container: #ff6b35;
        --navy: #dae2fd;
        --navy-soft: #c7c4d7;
        --error: #ffb4ab;
        --error-container: rgba(255, 180, 171, 0.2);
        --on-error-container: #ffb4ab;
        --success: #4ade80;
        --card-bg: #161f35;
        --card-border: rgba(192, 193, 255, 0.18);
        --badge-bg: rgba(11, 19, 38, 0.9);
        --hairline: rgba(192, 193, 255, 0.18);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Geist, Inter, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      a { color: inherit; text-decoration: none; }
      button { cursor: pointer; font: inherit; border: 0; background: none; }

      /* === HEADER === */
      .admin-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--surface);
        border-bottom: 1px solid var(--surface-border);
      }
      .admin-header .shell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
        width: min(1200px, calc(100% - 40px));
        margin-inline: auto;
      }
      .admin-header-left {
        display: flex;
        align-items: center;
        gap: 32px;
      }
      .admin-brand {
        font-family: Inter, sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--primary);
      }
      .admin-nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .admin-nav-link {
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-variant);
        transition: all 180ms ease;
      }
      .admin-nav-link:hover {
        background: var(--surface-container-low);
        color: var(--text);
      }
      .admin-nav-link.active {
        color: var(--primary);
        border-bottom: 2px solid var(--primary);
        border-radius: 0;
        padding-bottom: 6px;
      }
      .admin-header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .admin-icon-btn {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        color: var(--text-variant);
        transition: background 180ms ease;
      }
      .admin-icon-btn:hover { background: var(--surface-container-low); }

      .admin-settings-wrap { position: relative; }
      .admin-settings-menu {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 8px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 8px;
        display: none;
        flex-direction: column;
        gap: 4px;
        min-width: 140px;
        box-shadow: var(--shadow-hover);
        z-index: 50;
      }
      .admin-settings-menu.show { display: flex; }
      .admin-settings-opt {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.875rem;
        text-align: left;
        color: var(--text);
      }
      .admin-settings-opt:hover { background: var(--surface-container-high); }

      .admin-user-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 4px 4px;
        border: 1px solid var(--surface-border);
        border-radius: 999px;
        color: var(--text);
      }
      .admin-user-btn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

      /* === MAIN CANVAS === */
      .page-shell {
        width: min(1200px, calc(100% - 40px));
        margin: 32px auto 80px;
      }
      .page-header { margin-bottom: 28px; }
      .page-title { font-size: 1.8rem; font-weight: 700; margin: 0 0 6px; color: var(--text); }
      .page-subtitle { font-size: 0.95rem; color: var(--text-soft); margin: 0; }

      .workspace-grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
      @media (max-width: 900px) { .workspace-grid { grid-template-columns: 1fr; } }

      .panel-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: var(--shadow-soft);
      }

      .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .queue-count-badge {
        background: var(--tertiary-container); color: var(--on-tertiary-container); font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase;
      }

      .queue-list { display: flex; flex-direction: column; gap: 10px; }
      .queue-item {
        display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--surface-border); border-radius: 12px; background: var(--surface-soft); cursor: pointer; transition: all 160ms ease;
      }
      .queue-item:hover { border-color: var(--primary); background: var(--surface-container-high); }
      .queue-item.active { border-color: var(--primary); background: var(--surface-container-high); box-shadow: 0 0 0 1px var(--primary); }
      .user-avatar-circle {
        width: 40px; height: 40px; border-radius: 50%; background: var(--secondary-container); color: var(--on-secondary-container); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; overflow: hidden;
      }
      .user-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

      /* Details Panel */
      .details-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 16px; border-bottom: 1px solid var(--surface-border); margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

      .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
      @media (max-width: 600px) { .comparison-grid { grid-template-columns: 1fr; } }

      .media-preview-box {
        background: var(--surface-soft);
        border: 1px solid var(--surface-border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .media-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-soft); }
      .media-frame {
        width: 100%; height: 220px; border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--surface-border); display: flex; align-items: center; justify-content: center; position: relative;
      }
      .media-frame img { width: 100%; height: 100%; object-fit: cover; }

      /* Table */
      .data-table-wrap { border: 1px solid var(--surface-border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
      .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
      .data-table th { background: var(--surface-soft); padding: 12px 16px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-soft); border-bottom: 1px solid var(--surface-border); }
      .data-table td { padding: 14px 16px; border-bottom: 1px solid var(--surface-border); }
      .data-table tr:last-child td { border-bottom: 0; }

      /* Action Buttons */
      .btn-bar { display: flex; gap: 16px; }
      .btn-approve {
        flex: 1; padding: 14px; border-radius: 10px; background: var(--primary-container); color: var(--on-primary); font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 160ms ease;
      }
      .btn-approve:hover { opacity: 0.92; transform: translateY(-1px); }
      .btn-reject {
        flex: 1; padding: 14px; border-radius: 10px; background: var(--card-bg); border: 1px solid var(--error); color: var(--error); font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 160ms ease;
      }
      .btn-reject:hover { background: var(--error-container); }

      /* Empty Queue Null State */
      .null-state {
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; color: var(--text-soft); width: 100%;
      }
      .null-icon { font-size: 3.5rem; color: var(--text-soft); opacity: 0.5; margin-bottom: 12px; }

      /* Toast */
      .toast {
        position: fixed; bottom: 24px; right: 24px; background: var(--navy); color: #ffffff; padding: 14px 24px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: none; align-items: center; gap: 10px; z-index: 100; font-weight: 600;
      }
      .toast.show { display: flex; }
    </style>
  </head>
  <body>
    <!-- Top Admin Header -->
    <header class="admin-header">
      <div class="shell">
        <div class="admin-header-left">
          <span class="admin-brand">CouponEx</span>
          <nav class="admin-nav" aria-label="Admin navigation">
            <a class="admin-nav-link" href="admin-dashboard.html">Dashboard</a>
            <a class="admin-nav-link active" href="admin-identity.html">Identity</a>
            <a class="admin-nav-link" href="admin-verifications.html">Verifications</a>
            <a class="admin-nav-link" href="admin-payments.html">Payments</a>
            <a class="admin-nav-link" href="admin-payout-verifications.html">Payout Accounts</a>
          </nav>
        </div>
        <div class="admin-header-right">
          <div class="admin-settings-wrap">
            <button id="settings-toggle" class="admin-icon-btn" type="button" aria-label="Settings">
              <span class="material-symbols-outlined">notifications</span>
            </button>
            <div id="settings-menu" class="admin-settings-menu">
              <button class="admin-settings-opt" type="button" onclick="setTheme('dark')">Dark mode</button>
              <button class="admin-settings-opt" type="button" onclick="setTheme('light')">Light mode</button>
              <button class="admin-settings-opt" type="button" onclick="logout()">Logout</button>
            </div>
          </div>
          <button class="admin-user-btn" type="button" onclick="window.location.href='admin-profile.html'">
            <span class="material-symbols-outlined">admin_panel_settings</span>
            <span style="font-weight: 600; font-size: 0.9rem;">Admin</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Workspace Canvas -->
    <main class="page-shell">
      <div class="page-header">
        <h1 class="page-title">Identity Verification Workspace</h1>
        <p class="page-subtitle">Review and approve user identification documents to maintain marketplace trust.</p>
      </div>

      <div class="workspace-grid">
        <!-- Left Side: Verification Queue -->
        <div class="panel-card">
          <div class="queue-header">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin: 0;">Pending Queue</h3>
            <span class="queue-count-badge" id="queueCountBadge">0 PENDING</span>
          </div>
          <div class="queue-list" id="queueList">
            <!-- Dynamic Queue Items rendered here -->
          </div>
        </div>

        <!-- Right Side: Active Verification Details -->
        <div class="panel-card" id="detailsPanel">
          <!-- Active Request content rendered here -->
        </div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="adminToast" class="toast">
      <span class="material-symbols-outlined" style="color: var(--success);">check_circle</span>
      <span id="toastText">Action completed successfully</span>
    </div>

    <script>
      const DEFAULT_AVATAR = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23f1f5f9"/><path d="M50 42 a 16 16 0 1 0 0 -32 a 16 16 0 1 0 0 32 Z M20 85 c 0 -18 14 -28 30 -28 s 30 10 30 28 Z" fill="%2394a3b8"/></svg>';

      let queueData = [];
      let activeIndex = 0;

      const queueListEl = document.getElementById("queueList");
      const queueCountBadge = document.getElementById("queueCountBadge");
      const detailsPanelEl = document.getElementById("detailsPanel");

      // Settings Dropdown Toggle
      const settingsToggle = document.getElementById("settings-toggle");
      const settingsMenu = document.getElementById("settings-menu");
      if (settingsToggle && settingsMenu) {
        settingsToggle.addEventListener("click", (e) => {
          e.stopPropagation();
          settingsMenu.classList.toggle("show");
        });
        document.addEventListener("click", () => settingsMenu.classList.remove("show"));
      }

      function setTheme(theme) {
        document.documentElement.classList.toggle("theme-dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
        localStorage.setItem("couponex-theme", theme);
      }

      function logout() {
        localStorage.removeItem("couponex_user");
        window.location.href = "login.html";
      }

      function showToast(message) {
        const toast = document.getElementById("adminToast");
        document.getElementById("toastText").textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2600);
      }

      function renderWorkspace() {
        queueCountBadge.textContent = `${queueData.length} PENDING`;

        if (queueData.length === 0) {
          // Default Null State when no requests exist
          queueListEl.innerHTML = `
            <div class="null-state" style="padding: 40px 10px;">
              <span class="material-symbols-outlined null-icon">folder_open</span>
              <p style="font-weight: 600; margin: 0 0 4px;">No Pending Requests</p>
              <span style="font-size: 0.82rem;">When users submit identity verifications, they will appear here.</span>
            </div>
          `;

          detailsPanelEl.innerHTML = `
            <div class="null-state">
              <span class="material-symbols-outlined null-icon" style="font-size: 4rem;">verified_user</span>
              <h3 style="font-size: 1.2rem; font-weight: 700; margin: 0 0 8px; color: var(--text);">Identity Workspace Ready</h3>
              <p style="font-size: 0.9rem; max-width: 380px; margin: 0;">Select a user request from the pending queue to review documents and approve merchant status.</p>
            </div>
          `;
          return;
        }

        if (activeIndex >= queueData.length) activeIndex = 0;

        // Render Queue List
        queueListEl.innerHTML = queueData.map((item, idx) => {
          const initials = item.fullName.split(" ").map(n => n[0]).join("").toUpperCase().substring(0, 2) || "ID";
          const isActive = idx === activeIndex;
          return `
            <div class="queue-item ${isActive ? 'active' : ''}" onclick="selectQueueItem(${idx})">
              <div style="display:flex; align-items:center; gap:12px;">
                <div class="user-avatar-circle">
                  ${item.selfieImage ? `<img src="${item.selfieImage}" alt="${item.fullName}" />` : initials}
                </div>
                <div>
                  <div style="font-weight:700; font-size:0.95rem; color:var(--text);">${item.fullName}</div>
                  <div style="font-size:0.75rem; color:var(--text-soft);">Submitted ${item.submittedAt ? item.submittedAt.split(' ')[0] : 'recently'}</div>
                </div>
              </div>
              <span class="material-symbols-outlined" style="color:var(--primary);">chevron_right</span>
            </div>
          `;
        }).join('');

        // Render Active Request Details
        const currentItem = queueData[activeIndex];

        detailsPanelEl.innerHTML = `
          <div class="details-header">
            <div>
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
                <h2 style="font-size:1.4rem; font-weight:700; margin:0;">${currentItem.fullName}</h2>
                <span style="border:1px solid var(--tertiary-container); color:var(--tertiary-container); padding:2px 8px; border-radius:999px; font-size:0.72rem; font-weight:700; text-transform:uppercase;">
                  Identity Request
                </span>
              </div>
              <span style="font-size:0.85rem; color:var(--text-soft);">Application ID: #IDV-${currentItem.id} • User ID: #${currentItem.userId}</span>
            </div>
            <div style="text-align:right;">
              <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--text-soft); display:block;">Verification Status</span>
              <span style="font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--primary); font-size:1rem;">PENDING REVIEW</span>
            </div>
          </div>

          <!-- Document & Selfie Comparison Grid -->
          <div class="comparison-grid">
            <!-- Profile Photo / Selfie Match -->
            <div class="media-preview-box">
              <span class="media-title">Profile Photo / Selfie Match</span>
              <div class="media-frame">
                <img src="${currentItem.selfieImage || DEFAULT_AVATAR}" alt="Captured Selfie Photo" onerror="this.src=DEFAULT_AVATAR" />
              </div>
            </div>

            <!-- Government ID Scan (Renamed from Aadhaar Scan Front) -->
            <div class="media-preview-box">
              <span class="media-title">Government ID Scan</span>
              <div class="media-frame">
                <img src="${currentItem.idFrontImage || DEFAULT_AVATAR}" alt="Government ID Scan" onerror="this.src=DEFAULT_AVATAR" />
              </div>
            </div>
          </div>

          <!-- Data Comparison Table -->
          <div class="data-table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Field</th>
                  <th>Submitted Data</th>
                  <th>Status Check</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td style="font-weight:600; color:var(--text-soft);">Full Name</td>
                  <td style="font-weight:600;">${currentItem.fullName}</td>
                  <td><span class="material-symbols-outlined" style="color:var(--success); font-size:18px; vertical-align:middle;">check_circle</span> Matches</td>
                </tr>
                <tr>
                  <td style="font-weight:600; color:var(--text-soft);">Date of Birth</td>
                  <td>${currentItem.dob || "Not Provided"}</td>
                  <td><span class="material-symbols-outlined" style="color:var(--success); font-size:18px; vertical-align:middle;">check_circle</span> Valid</td>
                </tr>
                <tr>
                  <td style="font-weight:600; color:var(--text-soft);">ID Number</td>
                  <td style="font-family:'JetBrains Mono',monospace;">${currentItem.idNumber || "Not Provided"}</td>
                  <td><span class="material-symbols-outlined" style="color:var(--success); font-size:18px; vertical-align:middle;">check_circle</span> Verified Format</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Action Buttons -->
          <div class="btn-bar">
            <button class="btn-approve" type="button" onclick="processDecision(${currentItem.id}, 'approve')">
              <span class="material-symbols-outlined">check_circle</span>
              Approve Identity
            </button>
            <button class="btn-reject" type="button" onclick="processDecision(${currentItem.id}, 'reject')">
              <span class="material-symbols-outlined">cancel</span>
              Reject / Request Re-upload
            </button>
          </div>
        `;
      }

      function selectQueueItem(index) {
        activeIndex = index;
        renderWorkspace();
      }

      async function processDecision(verificationId, action) {
        const targetItem = queueData.find(item => item.id === verificationId || item.userId === verificationId);
        let rejectionReason = "";

        if (action === 'reject') {
          rejectionReason = prompt("Please enter the reason for rejection (e.g., ID document unreadable, selfie face mismatch):", "Document details or photo unreadable");
          if (rejectionReason === null) return; // User cancelled prompt
        }

        const status = action === 'approve' ? 'approved' : 'rejected';

        // 1. LocalStorage Sync for instant client feedback
        if (targetItem && targetItem.userId) {
          const userKey = "couponex_user_verification_" + targetItem.userId;
          const userVer = JSON.parse(localStorage.getItem(userKey) || "{}");
          userVer.status = status;
          userVer.rejectionReason = rejectionReason || "Rejected by admin";
          localStorage.setItem(userKey, JSON.stringify(userVer));

          // If current logged-in user is approved, set isVerified = 1
          const storedUser = JSON.parse(localStorage.getItem("couponex_user") || "null");
          if (storedUser && storedUser.id === targetItem.userId) {
            storedUser.isVerified = action === 'approve' ? 1 : 0;
            localStorage.setItem("couponex_user", JSON.stringify(storedUser));
          }
        }

        // Clean from local pending queue
        let localPending = JSON.parse(localStorage.getItem("couponex_pending_verifications") || "[]");
        localPending = localPending.filter(item => item.id !== verificationId && item.userId !== (targetItem ? targetItem.userId : null));
        localStorage.setItem("couponex_pending_verifications", JSON.stringify(localPending));

        // 2. Post decision to Backend API
        try {
          const apiEndpoint = (window.location.protocol === "file:" ? "http://localhost:8000" : "") + "/api/admin/verify-identity";
          await fetch(apiEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ verificationId, action, reason: rejectionReason })
          });
        } catch (error) {
          console.warn("Backend API offline for decision, updated local queue:", error);
        }
          console.warn("Backend API offline for decision, updated local queue:", error);
        }

        showToast(action === 'approve' ? "Identity verified successfully! User granted Gold Merchant status." : "Identity verification request rejected.");
        
        // Remove verified request from queue immediately
        queueData = queueData.filter(item => item.id !== verificationId && item.userId !== (targetItem ? targetItem.userId : null));
        renderWorkspace();
      }

      // Fetch Pending Queue from API and localStorage
      async function loadPendingQueue() {
        // 1. Synchronous instant local render (< 1ms)
        let localQueue = JSON.parse(localStorage.getItem("couponex_pending_verifications") || "[]");
        if (localQueue.length > 0) {
          queueData = localQueue.filter(item => item && (item.status === 'pending' || !item.status));
          renderWorkspace();
        }

        // 2. Fast background API fetch
        let apiQueue = [];
        try {
          const apiEndpoint = (window.location.protocol === "file:" ? "http://localhost:8000" : "") + "/api/admin/identity-verifications";
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 800);

          const response = await fetch(apiEndpoint, { signal: controller.signal });
          clearTimeout(timeoutId);
          const data = await response.json();
          if (data.success && Array.isArray(data.queue)) {
            apiQueue = data.queue;
          }
        } catch (err) {
          console.warn("Could not fetch remote admin identity queue:", err);
        }

        // Merge API queue and Local Storage queue cleanly
        const mergedMap = new Map();
        [...apiQueue, ...localQueue].forEach(item => {
          if (item && item.userId && !mergedMap.has(item.userId)) {
            mergedMap.set(item.userId, item);
          }
        });

        queueData = Array.from(mergedMap.values()).filter(item => item.status === 'pending' || !item.status);
        renderWorkspace();
      }

      // Real-time synchronization when user submits identity request in another tab
      window.addEventListener("storage", (e) => {
        if (e.key === "couponex_pending_verifications") {
          loadPendingQueue();
        }
      });
      setInterval(loadPendingQueue, 3000);

      loadPendingQueue();
    </script>
