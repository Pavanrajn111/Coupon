<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions Ledger | CouponEx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="header.js" defer></script>
    <script src="app.js" defer></script>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("couponex-theme");
        const theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("theme-dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        --bg: #fcf9f2;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --surface-border: #cbd5e1;
        --text: #0f172a;
        --text-soft: #475569;
        --primary: #ff6b35;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }
      html.theme-dark {
        --bg: #0b1326;
        --surface: #161f35;
        --surface-soft: #1e2742;
        --surface-border: rgba(192, 193, 255, 0.2);
        --text: #f2f5ff;
        --text-soft: #c0c7dc;
        --primary: #ff6b35;
        --shadow: 0 26px 80px rgba(0, 0, 0, 0.42);
      }
      body { margin: 0; font-family: Geist, Inter, sans-serif; background: var(--bg); color: var(--text); }
      .container { max-width: 1180px; margin: 32px auto 80px; padding: 0 16px; }
      
      .card {
        background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 28px; box-shadow: var(--shadow);
      }
      .table-wrap { overflow-x: auto; margin-top: 20px; }
      table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
      th { padding: 12px 16px; border-bottom: 2px solid var(--surface-border); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-soft); }
      td { padding: 16px; border-bottom: 1px solid var(--surface-border); }
      
      .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
      .badge-completed { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    </style>
  </head>
  <body>
    <div id="app-header"></div>

    <div class="container">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
          <div>
            <h1 style="margin:0 0 4px; font-size:1.6rem; font-weight:800;">Unified Transaction Ledger</h1>
            <p style="margin:0; color:var(--text-soft); font-size:0.9rem;">Complete financial audit trail of credit purchases, coupon orders, seller earnings, and payouts.</p>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Transaction ID</th>
                <th>Date & Time</th>
                <th>Type</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Currency</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="txn-tbody">
              <tr><td colspan="7" style="text-align:center; color:var(--text-soft);">Loading transaction ledger...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const storedUser = JSON.parse(localStorage.getItem("couponex_user") || "null") || { id: 1 };

      async function loadTransactions() {
        const baseUrl = window.location.protocol === "file:" ? "http://localhost:8000" : "";
        try {
          const res = await fetch(`${baseUrl}/api/profile/transactions/${storedUser.id}`);
          const data = await res.json();
          const tbody = document.getElementById("txn-tbody");

          if (data.success && Array.isArray(data.transactions) && data.transactions.length > 0) {
            tbody.innerHTML = data.transactions.map(t => {
              const isCredit = t.currency === 'C';
              const isAdd = t.type === 'CREDIT_PURCHASE' || t.type === 'SELLER_EARNING' || t.type === 'SELLER_CREDIT_CONVERSION';
              const sign = isAdd ? '+' : '-';
              const color = isAdd ? 'var(--success)' : 'var(--text)';
              return `
                <tr>
                  <td style="font-family:'JetBrains Mono', monospace; font-weight:700;">${t.transactionId}</td>
                  <td style="font-size:0.8rem; color:var(--text-soft);">${new Date(t.createdAt).toLocaleString()}</td>
                  <td><strong>${t.type.replace(/_/g, ' ')}</strong></td>
                  <td style="font-size:0.85rem; color:var(--text-soft);">${t.description || '-'}</td>
                  <td style="font-family:'JetBrains Mono', monospace; font-weight:700; color:${color};">
                    ${sign}${isCredit ? t.amount + 'C' : '₹' + t.amount}
                  </td>
                  <td><span style="font-family:'JetBrains Mono', monospace; font-weight:700;">${t.currency}</span></td>
                  <td><span class="badge badge-completed">${t.status || 'COMPLETED'}</span></td>
                </tr>
              `;
            }).join("");
          } else {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--text-soft);">No transactions recorded in the ledger yet.</td></tr>`;
          }
        } catch (err) {
          console.log("Error loading transactions:", err);
        }
      }

      loadTransactions();
    </script>
  </body>
</html>
