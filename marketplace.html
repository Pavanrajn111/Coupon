<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace | CouponEx</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="header.js" defer></script>
    <script src="app.js" defer></script>
    <script>
      (() => {
        const savedTheme = localStorage.getItem("couponex-theme");
        const theme =
          savedTheme ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.classList.toggle(
          "theme-dark",
          theme === "dark",
        );
        document.documentElement.dataset.theme = theme;
        document.addEventListener("DOMContentLoaded", () => {
          document.body.className = theme === "light" ? "theme-light" : "";
        });
      })();
    </script>
  </head>
  <body>
    <div id="app-header"></div>

    <main class="page">
      <div class="shell stack">
        <h1 class="section-title-new" style="font-size: 2.25rem; font-weight: 800; margin-top: 12px; margin-bottom: 4px;">Marketplace</h1>
        <p style="color: var(--text-soft); font-size: 0.95rem; margin-bottom: 24px;">Browse deals across top brands and platforms.</p>
      </div>
    </main>
  </body>
</html>
