<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Coupon | CouponEx</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="header.js" defer></script>
    <script src="app.js" defer></script>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('couponex-theme');
        const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.toggle('theme-light', theme === 'light');
        document.documentElement.classList.toggle('theme-dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
        document.addEventListener("DOMContentLoaded", () => {
          if (theme === "light") {
            document.body.classList.add("theme-light");
          }
        });
      })();
    </script>
    <style>
      :root {
        --card-bg: rgba(23, 31, 51, 0.94);
        --card-border: rgba(192, 193, 255, 0.28);
        --input-bg: rgba(11, 19, 38, 0.85);
        --input-border: rgba(192, 193, 255, 0.3);
        --text-heading: #f3f5ff;
        --text-sub: #cbd5e1;
        --text-input: #ffffff;
        --label-text: #e2e8f0;
        --shadow-block: 0 16px 40px rgba(0, 0, 0, 0.45);
      }

      body.theme-light, html.theme-light {
        --card-bg: #ffffff;
        --card-border: #cbd5e1;
        --input-bg: #f8fafc;
        --input-border: #94a3b8;
        --text-heading: #0f172a;
        --text-sub: #475569;
        --text-input: #0f172a;
        --label-text: #1e293b;
        --shadow-block: 0 12px 36px rgba(0, 0, 0, 0.08);
      }

      body {
        background-color: var(--bg, #0b1326);
        color: var(--text, #dae2fd);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .theme-block {
        background: var(--card-bg);
        border: 1.5px solid var(--card-border);
        box-shadow: var(--shadow-block);
        backdrop-filter: blur(16px);
      }

      .theme-input {
        background-color: var(--input-bg) !important;
        border: 1.5px solid var(--input-border) !important;
        color: var(--text-input) !important;
      }

      .theme-input::placeholder {
        color: var(--text-sub);
        opacity: 0.7;
      }

      .theme-input:focus {
        border-color: #ff6b35 !important;
        box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.25) !important;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Shared Centralized Header -->
    <div id="app-header"></div>

    <!-- Main Content Body -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-6 py-8">
      <div class="mb-8">
        <h2 class="text-3xl font-extrabold tracking-tight mb-2" style="color: var(--text-heading);">List a New Coupon</h2>
        <p class="text-base font-medium" style="color: var(--text-sub);">Verify and list your unused digital coupon for sale in India's secure P2P coupon exchange.</p>
      </div>

      <div class="theme-block p-8 rounded-3xl">
        <!-- Hidden Image File Input -->
        <input type="file" id="coupon-image-input" accept="image/*" class="hidden" style="display: none;" />

        <!-- Scan Coupon Card / Upload from Gallery Dropzone -->
        <div id="scan-dropzone" class="mb-8 p-6 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center cursor-pointer transition-all relative overflow-hidden group hover:border-[#ff6b35]" style="background-color: var(--input-bg); border-color: var(--input-border);">
          <div id="scan-empty-state" class="flex flex-col items-center justify-center text-center py-4">
            <div class="w-14 h-14 rounded-full flex items-center justify-center mb-3 shadow-inner" style="background-color: var(--card-bg); border: 1.5px solid var(--card-border);">
              <span class="material-symbols-outlined text-3xl" style="color: #ff6b35;">photo_camera</span>
            </div>
            <p class="text-lg font-bold mb-1" style="color: var(--text-heading);">Scan your coupon</p>
            <p class="text-sm font-medium mb-4" style="color: var(--text-sub);">Position code within frame or select an image from gallery</p>
            <button type="button" id="upload-gallery-btn" class="px-5 py-2.5 rounded-full font-bold text-xs uppercase tracking-wider flex items-center gap-2 transition-all shadow-md hover:scale-[1.02]" style="background-color: var(--card-bg); border: 1.5px solid var(--card-border); color: var(--text-heading);">
              <span class="material-symbols-outlined text-base" style="color: #ff6b35;">image</span>
              Upload from gallery
            </button>
          </div>

          <div id="scan-preview-state" class="hidden w-full flex flex-col items-center justify-center py-2 relative">
            <img id="coupon-preview-img" src="" alt="Coupon Preview" class="max-h-60 max-w-full rounded-xl object-contain shadow-lg border" style="border-color: var(--card-border);" />
            <button type="button" id="remove-image-btn" class="mt-4 px-4 py-1.5 rounded-full text-xs font-bold text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all flex items-center gap-1 border border-red-500/30">
              <span class="material-symbols-outlined text-base">delete</span> Remove & Choose Another
            </button>
          </div>
        </div>

        <form id="sell-form" onsubmit="handleSubmit(event)" class="space-y-6">
          <!-- Brand and Category -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">Brand / Platform Name</label>
              <input id="brand-name" type="text" placeholder="e.g. Swiggy, Amazon, Myntra" required class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">Category</label>
              <select id="category" class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all">
                <option value="Food & Dining">Food & Dining</option>
                <option value="Travel & Flights">Travel & Flights</option>
                <option value="Fashion & Apparel">Fashion & Apparel</option>
                <option value="Electronics">Electronics</option>
                <option value="Streaming & Entertainment">Streaming & Entertainment</option>
              </select>
            </div>
          </div>

          <!-- Coupon Code & Expiry -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">Coupon / Voucher Code</label>
              <input id="coupon-code" type="text" placeholder="e.g. SWIGGY50OFF" required class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">Expiration Date</label>
              <input id="expiry-date" type="date" required class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all" />
            </div>
          </div>

          <!-- Price & Value -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">Original Voucher Value (INR)</label>
              <input id="original-price" type="number" placeholder="e.g. 500" required class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all" />
            </div>
            <div>
              <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">Asking Price (Credits)</label>
              <input id="asking-price" type="number" placeholder="e.g. 350" required class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all" />
            </div>
          </div>

          <!-- Description / Terms -->
          <div>
            <label class="block text-sm font-bold mb-2" style="color: var(--label-text);">T&C / Description</label>
            <textarea id="description" rows="4" placeholder="Mention minimum order value, valid items, or any specific constraints..." class="theme-input w-full px-4 py-3 rounded-2xl focus:outline-none transition-all"></textarea>
          </div>

          <!-- Submit -->
          <button type="submit" class="w-full text-white py-4 rounded-2xl font-extrabold text-lg shadow-lg hover:opacity-95 transition-all transform active:scale-[0.99]" style="background: linear-gradient(135deg, #ff6b35 0%, #ab3500 100%);">Submit for Verification</button>
        </form>
      </div>
    </main>

    <footer class="border-t py-8 px-6 text-center text-sm font-medium" style="background-color: var(--card-bg); border-color: var(--card-border); color: var(--text-sub);">
      <p>&copy; 2026 CouponEx. India's P2P Digital Coupon Exchange. All rights reserved.</p>
    </footer>

    <script>
      let selectedImageDataUrl = "";

      document.addEventListener("DOMContentLoaded", () => {
        const dropzone = document.getElementById("scan-dropzone");
        const fileInput = document.getElementById("coupon-image-input");
        const uploadBtn = document.getElementById("upload-gallery-btn");
        const removeBtn = document.getElementById("remove-image-btn");
        const emptyState = document.getElementById("scan-empty-state");
        const previewState = document.getElementById("scan-preview-state");
        const previewImg = document.getElementById("coupon-preview-img");

        function openFileExplorer(e) {
          if (e) e.stopPropagation();
          fileInput.click();
        }

        dropzone?.addEventListener("click", (e) => {
          if (e.target.closest("#remove-image-btn")) return;
          openFileExplorer(e);
        });

        uploadBtn?.addEventListener("click", openFileExplorer);

        fileInput?.addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;

          if (!file.type.startsWith("image/")) {
            alert("Please select a valid image file.");
            return;
          }

          const reader = new FileReader();
          reader.onload = (event) => {
            selectedImageDataUrl = event.target.result;
            previewImg.src = selectedImageDataUrl;
            emptyState.classList.add("hidden");
            previewState.classList.remove("hidden");
          };
          reader.readAsDataURL(file);
        });

        removeBtn?.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedImageDataUrl = "";
          fileInput.value = "";
          previewImg.src = "";
          previewState.classList.add("hidden");
          emptyState.classList.remove("hidden");
        });
      });

      function handleSubmit(event) {
        event.preventDefault();
        const user = localStorage.getItem("couponex_user") ? JSON.parse(localStorage.getItem("couponex_user")) : null;
        const userId = user ? user.id : 1;

        const localId = Date.now();
        const couponData = {
          id: localId,
          userId: userId,
          brand: document.getElementById('brand-name')?.value,
          category: document.getElementById('category')?.value,
          code: document.getElementById('coupon-code')?.value,
          expiryDate: document.getElementById('expiry-date')?.value,
          originalValue: parseFloat(document.getElementById('original-price')?.value || 0),
          askingPrice: parseFloat(document.getElementById('asking-price')?.value || 0),
          description: document.getElementById('description')?.value,
          image: selectedImageDataUrl || "",
          status: 'pending',
          createdAt: new Date().toISOString()
        };

        // Always sync local storage for preview & offline support
        const localCoupons = JSON.parse(localStorage.getItem('couponex_coupons') || '[]');
        localCoupons.unshift(couponData);
        localStorage.setItem('couponex_coupons', JSON.stringify(localCoupons));

        const pending = JSON.parse(localStorage.getItem('pending_coupons') || '[]');
        pending.unshift(couponData);
        localStorage.setItem('pending_coupons', JSON.stringify(pending));

        const apiUrl = window.location.protocol === "file:" ? "http://localhost:8000/api/profile/coupon" : "/api/profile/coupon";

        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(couponData)
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert('Listing submitted successfully! Sent for admin verification.');
            location.href = 'admin-verifications.html';
          } else {
            alert('Error: ' + (data.error || 'Failed to submit listing'));
          }
        })
        .catch((err) => {
          console.warn("API submit warning (using local sync):", err);
          alert('Listing submitted successfully! Sent for verification.');
          location.href = 'admin-verifications.html';
        });
      }
    </script>
  </body>
</html>
